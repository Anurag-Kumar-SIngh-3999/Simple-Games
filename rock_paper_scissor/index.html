<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="nav">
        <div id="heading">WELCOME ! TO OUR STONE PAPER SCISSOR GAME</div>
        <div id="theme"><buton id="mode">Change theme</buton></div>
    </div>
    <div id="hand">
        <div class="symbols STONE">
        </div>
        <div class="symbols PAPER">
        </div>
        <div class="symbols SCISSOR">
        </div>
    </div>

    <div id="score-board">
        <div class="score">
            YOU
            <div id="myscore"></div>
        </div>
        <div class="score">
            COMP
            <div id="comscore"></div>
        </div>
    </div>

    <!-- main playing portion of the game  -->
     
    <div class="match">
        <div class="key">
            <div id="mykey"> div1 </div>
            <div id="comkey"> div2 </div>
        </div>
        <div class="options">
            <div class="act-stone"> stone </div>
            <div class="act-paper"> paper </div>
            <div class="act-scissor"> scissor </div>
        </div>
    </div>


    <script src="app.js"></script>
</body>
</html>
